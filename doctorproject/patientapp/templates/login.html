<!DOCTYPE html> 

<html lang="en"> 

<head> 

<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 

<title>Patient Login</title> 

<style> 
 
    * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
    } 
 
    body { 
        font-family: Arial, sans-serif; 
        background-color: #f2f7fc; 
        min-height: 100vh; 
 
        display: flex; 
        justify-content: center; 
        align-items: center; 
    } 
 
    .login-container { 
        width: 400px; 
        background-color: white; 
        padding: 40px; 
 
        border-radius: 10px; 
 
        box-shadow: 
            0 5px 20px rgba(0, 0, 0, 0.1); 
    } 
 
    .logo { 
        text-align: center; 
        font-size: 35px; 
        margin-bottom: 10px; 
    } 
 
    .login-container h1 { 
        text-align: center; 
        color: #1677ff; 
        margin-bottom: 8px; 
    } 
 
    .subtitle { 
        text-align: center; 
        color: #666; 
        margin-bottom: 30px; 
    } 
 
    .form-group { 
        margin-bottom: 20px; 
    } 
 
    .form-group label { 
        display: block; 
        margin-bottom: 8px; 
 
        font-weight: bold; 
        color: #333; 
    } 
 
    .form-group input { 
        width: 100%; 
 
        padding: 12px; 
 
        border: 1px solid #ccc; 
        border-radius: 6px; 
 
        font-size: 15px; 
        outline: none; 
    } 
 
    .form-group input:focus { 
        border-color: #1677ff; 
    } 
 
    .forgot-password {
        text-align: right;
        margin-top: -8px;
        margin-bottom: 20px;
    }

    .forgot-password a {
        color: #1677ff;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
    }

    .forgot-password a:hover {
        text-decoration: underline;
    }
 
    .login-btn { 
        width: 100%; 
 
        padding: 13px; 
 
        border: none; 
        border-radius: 6px; 
 
        background-color: #1677ff; 
        color: white; 
 
        font-size: 16px; 
        font-weight: bold; 
 
        cursor: pointer; 
    } 
 
    .login-btn:hover { 
        background-color: #095dcc; 
    } 
 
    .signup-text { 
        text-align: center; 
 
        margin-top: 22px; 
 
        color: #666; 
    } 
 
    .signup-text a { 
        color: #1677ff; 
        text-decoration: none; 
        font-weight: bold; 
    } 
 
    .signup-text a:hover { 
        text-decoration: underline; 
    } 
 
    .back-home { 
        text-align: center; 
        margin-top: 15px; 
    } 
 
    .back-home a { 
        color: #555; 
        text-decoration: none; 
        font-size: 14px; 
    } 
 
    .back-home a:hover { 
        color: #1677ff; 
    } 
 
    .error-message { 
        background-color: #ffe5e5; 
        color: #d00000; 
 
        padding: 10px; 
 
        border-radius: 5px; 
 
        margin-bottom: 20px; 
 
        text-align: center; 
    } 
 
</style> 

</head> 

<body> 

<div class="login-container"> 


<div class="logo"> 
    🩺 
</div> 

<h1> 
    Patient Login 
</h1> 

<p class="subtitle"> 
    Login to your account 
</p> 


<!-- Django error message --> 

{% if error %} 

    <div class="error-message"> 
        {{ error }} 
    </div> 

{% endif %} 


<form method="POST"> 

    {% csrf_token %} 


    <!-- Email --> 

    <div class="form-group"> 

        <label for="email"> 
            Email 
        </label> 

        <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your email" 
            required 
        > 

    </div> 


    <!-- Password --> 

    <div class="form-group"> 

        <label for="password"> 
            Password 
        </label> 

        <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required 
        > 

    </div> 


    <!-- Forgot Password --> 

    <div class="forgot-password">
        <a href="{% url 'forgot_password' %}">
            Forgot Password?
        </a>
    </div>


    <!-- Login Button --> 

    <button 
        type="submit" 
        class="login-btn"> 

        Login 

    </button> 

</form> 


<p class="signup-text"> 

    Don't have an account? 

    <a href="/signup/"> 
        Create Account 
    </a> 

</p> 


<div class="back-home"> 

    <a href="/"> 
        ← Back to Home 
    </a> 

</div> 


</div> 

</body> 

</html>
