<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile | MediCare</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container">

    <div
        class="card shadow mx-auto mt-5"
        style="max-width: 700px;"
    >

        <div class="card-body p-4">

            <h2 class="text-center mb-4">
                ✏️ Edit Profile
            </h2>


            <div class="text-center mb-4">

                {% if user.profile_pic %}

                    <img
                        src="{{ user.profile_pic.url }}"
                        style="
                            width:120px;
                            height:120px;
                            border-radius:50%;
                            object-fit:cover;
                        "
                    >

                {% else %}

                    <div
                        style="
                            width:120px;
                            height:120px;
                            border-radius:50%;
                            background:#e9ecef;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:50px;
                            margin:auto;
                        "
                    >
                        👤
                    </div>

                {% endif %}

            </div>


            <form
                method="POST"
                enctype="multipart/form-data"
            >

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        Username
                    </label>

                    {{ form.username }}
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    {{ form.email }}
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Mobile
                    </label>

                    {{ form.mobile }}
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Date of Birth
                    </label>

                    {{ form.dob }}
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Gender
                    </label>

                    {{ form.gender }}
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        City
                    </label>

                    {{ form.city }}
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        State
                    </label>

                    {{ form.state }}
                </div>


                <div class="mb-4">
                    <label class="form-label">
                        Profile Picture
                    </label>

                    {{ form.profile_pic }}
                </div>


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        💾 Save Changes
                    </button>

                    <a
                        href="{% url 'profile' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
