<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Reset Password | MediCare</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .reset-box {
        width: 400px;
        max-width: 90%;
        background: white;
        padding: 35px;
        border-radius: 15px;

        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    h2 {
        text-align: center;
        margin-bottom: 10px;
        color: #222;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 6px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #0d6efd;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;

        border: none;
        border-radius: 7px;

        background: #0d6efd;
        color: white;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
    }

    button:hover {
        background: #0b5ed7;
    }

    .error {
        background: #ffe5e5;
        color: #d00000;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        text-align: center;
    }
</style>


</head>

<body>

<div class="reset-box">


<h2>🔐 Reset Password</h2>

<p class="subtitle">
    Enter your new password below.
</p>

{% if error %}
    <div class="error">
        {{ error }}
    </div>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <label for="password">
        New Password
    </label>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter new password"
        minlength="6"
        required
    >

    <label for="confirm_password">
        Confirm Password
    </label>

    <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        placeholder="Confirm new password"
        minlength="6"
        required
    >

    <button type="submit">
        Reset Password
    </button>

</form>


</div>

</body>
</html>
